<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morrigan Installer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .download-links {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .download-links a {
            display: block;
            padding: 10px;
            margin: 5px 0;
            background: #007acc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .download-links a:hover {
            background: #005a9e;
        }
        #status {
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const statusEl = document.getElementById('status');
            const redirectUrl = "releases/latest/morrigan-client.exe";
            
            statusEl.textContent = "Redirecting to Windows installer...";
            
            console.log("Redirecting to:", redirectUrl);
            
            // Add a small delay to show the status message
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 1500);
        });
    </script>
</head>
<body>
    <div id="status">Detecting your platform...</div>
    
    <div class="download-links">
        <h3>Manual Download Link:</h3>
        <a href="releases/latest/morrigan-client.exe">📥 Windows (64-bit)</a>
    </div>
    
    <p><a href="releases/latest/">📁 View all available files</a></p>
    <p><a href="releases/">📋 View all versions</a></p>
</body>
</html>
